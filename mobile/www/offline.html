<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BeWelcome</title>
    <style>
        :root { color-scheme: light; }
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1.5rem; box-sizing: border-box; background: #fff; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
        .box { max-width: 20rem; }
        .logo { width: 4rem; height: 4rem; margin: 0 auto 1.25rem; border-radius: 1.2rem; background: #f37000; }
        h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
        p { margin: 0 0 1.5rem; color: #64748b; line-height: 1.45; }
        button { padding: 0.8rem 1.6rem; border: 0; border-radius: 999px; background: #f37000; color: #fff; font: inherit; font-weight: 700; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo" aria-hidden="true"></div>
        <h1>No connection</h1>
        <p>BeWelcome can't be reached right now. Check your connection and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
</body>
</html>
